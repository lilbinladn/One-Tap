p{color:var(--mut);margin:6px 0 10px;line-height:1.4;font-size:14px}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
button{font:inherit;font-weight:700;border:2px solid var(--ring);background:transparent;color:var(--fg);border-radius:12px;padding:8px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.g button{padding:8px 0;font-size:17px;line-height:1.1}
small{display:block;font-size:11px;color:var(--mut);font-weight:500}
button:disabled{opacity:.3;cursor:not-allowed}
.done{border-color:var(--ok)}
.sel{background:var(--ring);color:var(--bg)}.sel small{color:var(--bg)}
.main{background:var(--hot);border-color:var(--hot);color:#fff}

label{font-size:13px;color:var(--mut);display:block;margin-top:10px}
input[type=range]{width:70%;vertical-align:middle}
.big{font-size:56px;font-weight:700;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}td,th{padding:5px 4px;text-align:left;border-bottom:1px solid #8884}
body{background:linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--hot) 14%,var(--bg)))}

.list h2{position:sticky;top:0;margin:0;padding:6px 4px;background:var(--bg);z-index:1}
.card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-radius:14px 30px 30px 14px;border:0;border-left:6px solid var(--ring);background:var(--pan);padding:9px 14px;box-shadow:0 3px 12px #0003;flex:none}
.card:hover:not(:disabled){transform:translateX(-6px);background:var(--hot);color:#fff}
.card b{font-size:20px;min-width:34px}.card span{flex:1;min-width:0}.card i{font-style:normal;font-size:12px;display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.card:hover i{color:#fffc}.card em{font-style:normal;font-size:22px;font-weight:700;color:var(--ok)}
.nb{color:var(--hot);font-size:15px;font-weight:700;margin:2px 0 8px}
.card u{text-decoration:none;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:3px 9px;white-space:nowrap;flex:none;letter-spacing:.2px}
.card:hover u{outline:2px solid #fff9}
.side p b{color:var(--fg)}
@media(max-width:700px){.wrap{grid-template-columns:1fr;height:auto}.side{overflow:visible}.list{overflow:visible}}

.ed-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.hint{font-size:12px;margin:0}
.acct{margin:8px 0 4px;padding:8px 10px;border:2px solid #8884;border-radius:12px;text-align:left}
.ac-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ac-row>div{flex:1;min-width:120px}.ac-row b{font-size:14px}.ac-row small{white-space:normal;line-height:1.3;margin-top:1px}
